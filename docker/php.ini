; Kachow runtime settings (the app sets UTC itself; the container clock is Europe/Copenhagen so cron times match the old host).
expose_php = Off
memory_limit = 256M
max_execution_time = 120
upload_max_filesize = 20M
post_max_size = 25M
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2
opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
session.cookie_httponly = 1
session.cookie_samesite = Lax
